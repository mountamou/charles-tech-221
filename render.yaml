# Prepared configuration. Creating these paid resources requires account-owner approval.
services:
  - type: web
    name: charles-tech-221
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    healthCheckPath: /api/health
    disk:
      name: project-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: charles-tech-221-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: charlescamara310@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMPLOYEE_PASSWORD
        generateValue: true
databases:
  - name: charles-tech-221-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: charlestech
    user: charlestech
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
