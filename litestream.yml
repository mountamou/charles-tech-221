# Continuous replication of the SQLite database to Cloudflare R2.
# Values are expanded from the container environment (see src/index.js).
dbs:
  - path: /data/charlestech.db
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: litestream/charlestech.db
      endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
